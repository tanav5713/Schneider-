<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCADA-HMI v4.8</title>
<style>
  :root{
    --bg:#0a0e15;
    --bg-panel:#0d141f;
    --bg-panel-2:#0b111a;
    --bg-input:#0f1722;
    --border:#1c2735;
    --border-soft:#141d29;
    --text:#e6edf5;
    --text-dim:#8a97a8;
    --text-faint:#54637a;
    --cyan:#22d3ee;
    --cyan-2:#38bdf8;
    --green:#22c55e;
    --green-dim:#123521;
    --amber:#f59e0b;
    --amber-dim:#3a2a0a;
    --red:#ef4444;
    --red-dim:#3a1414;
    --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;flex-direction:column;height:100vh;min-height:600px;}

  /* ---------- Topbar ---------- */
  .topbar{
    flex:0 0 60px;height:60px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg-panel-2);
    gap:16px; flex-wrap:nowrap; overflow-x:auto;
  }
  .tb-left{display:flex;align-items:center;gap:22px;white-space:nowrap;}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px;}
  .logo .icon-box{
    width:28px;height:28px;border-radius:6px;background:rgba(34,211,238,.1);
    display:flex;align-items:center;justify-content:center;color:var(--cyan);border:1px solid rgba(34,211,238,.25);
  }
  .tb-meta{display:flex;gap:18px;color:var(--text-dim);font-size:13px;}
  .tb-meta b{color:var(--text);font-weight:600;}
  .tb-right{display:flex;align-items:center;gap:18px;white-space:nowrap;}
  .tb-status{display:flex;align-items:center;gap:16px;padding-right:16px;border-right:1px solid var(--border);font-size:13px;color:var(--text-dim);}
  .status-pill{display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.7);flex:0 0 auto;}
  .dot.grey{background:var(--text-faint);box-shadow:none;}
  .dot.red{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,.7);}
  .clock{font-family:var(--font-mono);color:var(--amber);font-size:14px;font-weight:600;letter-spacing:.3px;}
  .estop-btn{
    display:flex;align-items:center;gap:7px;background:var(--red);color:#fff;border:none;
    padding:9px 14px;border-radius:7px;font-weight:700;font-size:12.5px;cursor:pointer;letter-spacing:.3px;
  }
  .estop-btn:hover{background:#dc2626;}
  .estop-btn.active{background:#7f1d1d;color:#fecaca;animation:estop-pulse 1s infinite;}
  @keyframes estop-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.55);}50%{box-shadow:0 0 0 6px rgba(239,68,68,0);}}

  /* ---------- Body layout ---------- */
  .body{flex:1;display:flex;min-height:0;}
  .sidebar{width:300px;flex:0 0 300px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-panel-2);}
  .nav-section-label{font-size:11px;letter-spacing:1.2px;color:var(--text-faint);font-weight:700;padding:18px 22px 10px;}
  .nav{padding:0 12px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:8px;color:var(--text-dim);
    cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;position:relative;border:1px solid transparent;
  }
  .nav-item svg{flex:0 0 auto;opacity:.85;}
  .nav-item:hover{background:var(--bg-panel);color:var(--text);}
  .nav-item.active{background:rgba(34,211,238,.08);color:var(--cyan);border-color:rgba(34,211,238,.18);}
  .nav-item.active svg{opacity:1;}
  .nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .sidebar-foot{padding:16px;border-top:1px solid var(--border);}
  .sim-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .sim-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .sim-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--text);}
  .sim-title svg{color:var(--cyan);}
  .active-badge{background:var(--green-dim);color:var(--green);font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:5px;display:flex;align-items:center;gap:5px;}
  .active-badge .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .sim-label{font-size:11.5px;color:var(--text-faint);display:flex;justify-content:space-between;margin-bottom:7px;}
  .sim-label b{color:var(--cyan-2);font-weight:600;}
  .sim-speeds{display:flex;gap:6px;}
  .sim-speed-btn{flex:1;padding:6px 0;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-mono);}
  .sim-speed-btn.active{background:rgba(34,211,238,.12);border-color:var(--cyan);color:var(--cyan);}
  .sidebar-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);padding:2px 4px;font-family:var(--font-mono);}

  .main{flex:1;overflow-y:auto;padding:26px 30px 50px;}
  .page-header{margin-bottom:22px;}
  .page-header h1{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:.1px;}
  .page-header p{margin:0;color:var(--text-dim);font-size:13.5px;}
  .page-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}

  /* ---------- Panels / cards ---------- */
  .panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:20px;}
  .panel + .panel{margin-top:18px;}
  .section-label{display:flex;align-items:center;gap:9px;color:var(--cyan);font-weight:700;font-size:12.5px;letter-spacing:.9px;text-transform:uppercase;margin-bottom:16px;}
  .section-label .rgt{margin-left:auto;color:var(--text-faint);font-weight:500;letter-spacing:.2px;text-transform:none;font-size:12px;}

  .banner{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;}
  .banner-left{display:flex;align-items:center;gap:14px;}
  .banner-dot{width:12px;height:12px;border-radius:50%;background:var(--text-faint);flex:0 0 auto;}
  .banner-dot.run{background:var(--green);box-shadow:0 0 10px rgba(34,197,94,.7);animation:pulse 1.4s infinite;}
  .banner-dot.trip{background:var(--red);box-shadow:0 0 10px rgba(239,68,68,.7);animation:pulse 1s infinite;}
  .banner-title{font-size:18px;font-weight:700;}
  .banner-title span{font-weight:800;}
  .banner-desc{color:var(--text-dim);font-size:13.5px;margin-top:3px;}
  .banner-right{display:flex;align-items:center;gap:22px;}
  .mode-block{text-align:right;}
  .mode-block .lbl{font-size:11px;color:var(--text-faint);letter-spacing:.4px;}
  .mode-block .val{font-weight:700;color:var(--cyan-2);font-size:14.5px;}
  .btn{border:none;border-radius:7px;padding:11px 18px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .btn-start{background:var(--green);color:#06210f;}
  .btn-start:hover{background:#16a34a;}
  .btn-stop-solid{background:var(--red);color:#fff;}
  .btn-stop-solid:hover{background:#dc2626;}
  .btn-outline{background:var(--bg-input);color:var(--text-dim);border:1px solid var(--border);}
  .btn-outline:hover{color:var(--text);border-color:#2a3646;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .grid-nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:18px;}
  .node-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:18px;position:relative;}
  .node-tag{flex:0 0 auto;align-self:flex-start;font-size:10.5px;font-weight:700;color:var(--cyan);border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.07);padding:3px 8px;border-radius:5px;letter-spacing:.4px;white-space:nowrap;}
  .node-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:16px;}
  .node-icon{width:34px;height:34px;border-radius:8px;background:rgba(34,211,238,.08);display:flex;align-items:center;justify-content:center;color:var(--cyan-2);flex:0 0 auto;}
  .node-head-text{flex:1 1 auto;min-width:0;}
  .node-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .node-sub{font-size:12px;color:var(--text-dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .node-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-dim);padding:6px 0;}
  .node-row b{color:var(--text);font-family:var(--font-mono);font-weight:600;}
  .node-row b.ok{color:var(--green);}

  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;}
  .stat-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px;}
  .stat-card.stopped{border-color:rgba(239,68,68,.4);background:linear-gradient(180deg,rgba(239,68,68,.06),transparent 60%);}
  .stat-card.running{border-color:rgba(34,197,94,.4);background:linear-gradient(180deg,rgba(34,197,94,.06),transparent 60%);}
  .stat-label{font-size:12px;color:var(--text-dim);font-weight:600;letter-spacing:.2px;margin-bottom:10px;text-transform:uppercase;}
  .stat-value{font-family:var(--font-mono);font-size:26px;font-weight:700;line-height:1;}
  .stat-value.stopped{color:var(--red);}
  .stat-value.running{color:var(--green);}
  .stat-value .unit{font-size:15px;font-weight:600;color:var(--text-dim);margin-left:5px;}
  .stat-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--text-faint);}

  /* ---------- Motor Control ---------- */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media(max-width:980px){.two-col{grid-template-columns:1fr;}}
  .interlock-row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--border-soft);}
  .interlock-row:first-child{padding-top:2px;}
  .il-name{font-size:14px;color:var(--text);}
  .badge{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:6px;letter-spacing:.3px;}
  .badge.grey{background:var(--bg-input);color:var(--text-dim);border:1px solid var(--border);}
  .badge.green{background:var(--green-dim);color:var(--green);}
  .badge.amber{background:var(--amber-dim);color:var(--amber);}
  .badge.red{background:var(--red-dim);color:#fca5a5;}
  .badge.cyan{background:rgba(34,211,238,.1);color:var(--cyan);}

  .ctl-buttons{display:flex;gap:12px;margin-top:16px;}
  .ctl-buttons .btn{flex:1;justify-content:center;}
  .full-estop{width:100%;margin-top:12px;background:var(--red-dim);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:8px;padding:13px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;}
  .full-estop:hover{background:rgba(239,68,68,.16);}
  .full-estop.active{background:var(--red);color:#fff;animation:estop-pulse 1s infinite;}

  .mode-toggle{display:flex;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .mode-toggle button{border:none;background:transparent;color:var(--text-dim);padding:7px 14px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .mode-toggle button.active{background:var(--cyan-2);color:#04202b;}

  .sp-block{margin-bottom:22px;}
  .sp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .sp-head .name{font-weight:700;font-size:14.5px;}
  .sp-head .val{font-family:var(--font-mono);font-weight:700;font-size:20px;color:var(--cyan-2);}
  .sp-range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text-faint);margin-bottom:6px;}
  .sp-range-labels .actual{color:var(--text-dim);}
  .sp-range-labels .actual b{color:var(--green);font-family:var(--font-mono);}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--border);outline:none;margin:4px 0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--cyan-2);border:3px solid #04202b;cursor:pointer;box-shadow:0 0 0 3px rgba(56,189,248,.18);}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--cyan-2);border:3px solid #04202b;cursor:pointer;}
  .preset-row{display:flex;gap:10px;margin-top:12px;}
  .preset-btn{flex:1;padding:9px 0;border-radius:7px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-dim);font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--font-mono);}
  .preset-btn:hover{color:var(--text);border-color:#2a3646;}
  .note-box{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:13px 15px;font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-top:6px;}
  .note-box b{color:var(--cyan-2);}
  .note-box .pid{float:right;text-align:right;}
  .note-box .pid .lbl{display:block;color:var(--text-faint);font-size:11px;}
  .note-box .pid .v{color:var(--green);font-weight:700;}

  /* ---------- Energy / Trends ---------- */
  .range-tabs{display:flex;gap:6px;}
  .range-tabs button{padding:7px 13px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-dim);font-weight:700;font-size:12.5px;cursor:pointer;}
  .range-tabs button.active{background:rgba(34,211,238,.12);border-color:var(--cyan);color:var(--cyan);}
  .egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:18px;}
  .stat2-value{font-family:var(--font-mono);font-size:24px;font-weight:700;}
  .stat2-sub{font-size:12px;color:var(--green);margin-top:8px;font-weight:600;}
  .chart-legend{display:flex;gap:18px;margin-left:auto;font-size:12px;color:var(--text-dim);font-weight:500;}
  .chart-legend span{display:flex;align-items:center;gap:6px;}
  .chart-legend i{width:14px;height:2.5px;border-radius:2px;display:inline-block;}
  .chart-wrap{width:100%;overflow:hidden;}
  .chart-wrap svg{width:100%;height:auto;display:block;}

  .trend-two{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  @media(max-width:980px){.trend-two{grid-template-columns:1fr;}}
  .pf-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;}
  .pf-value{font-family:var(--font-mono);font-size:44px;font-weight:800;color:var(--green);}
  .pf-label{color:var(--text-dim);font-size:13px;margin-top:10px;}
  .pf-bar-track{width:100%;max-width:280px;height:7px;background:var(--bg-input);border-radius:4px;margin-top:18px;overflow:hidden;}
  .pf-bar-fill{height:100%;background:linear-gradient(90deg,#0891b2,var(--green));border-radius:4px;transition:width .3s;}

  /* ---------- Alarms ---------- */
  .alarm-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .unack-pill{background:var(--red-dim);border:1px solid rgba(239,68,68,.4);color:#fca5a5;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:7px;}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;color:var(--text-faint);font-size:12px;font-weight:600;padding:0 14px 12px;border-bottom:1px solid var(--border);}
  tbody td{padding:15px 14px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .sev-pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:5px;letter-spacing:.4px;}
  .sev-INFO{background:rgba(34,211,238,.1);color:var(--cyan);}
  .sev-WARNING{background:var(--amber-dim);color:var(--amber);}
  .sev-CRITICAL{background:var(--red-dim);color:#fca5a5;}
  .src-link{color:var(--cyan-2);font-family:var(--font-mono);font-size:12.5px;}
  .status-ack{color:var(--text-faint);font-weight:600;font-size:12.5px;}
  .status-unack{color:var(--amber);font-weight:700;font-size:12.5px;}
  .ack-btn{background:var(--cyan-2);color:#04202b;border:none;padding:6px 13px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;}
  .ack-btn:hover{background:#5ec9fb;}
  .empty-cell{color:var(--text-faint);}

  /* ---------- Settings ---------- */
  .settings-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
  @media(max-width:1150px){.settings-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:760px){.settings-grid{grid-template-columns:1fr;}}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px;}
  .field input{
    width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;
    padding:10px 12px;color:var(--text);font-family:var(--font-mono);font-size:13.5px;
  }
  .field input:focus{outline:none;border-color:var(--cyan-2);}
  .priv-box{background:var(--bg-panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:16px;}
  .priv-box .u{font-weight:700;color:var(--text);font-size:13.5px;}
  .priv-box .lvl{color:var(--green);font-weight:700;font-size:13px;margin-top:4px;}
  .priv-box .perms{color:var(--text-dim);font-size:12.5px;margin-top:12px;line-height:1.6;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#232f3e;border-radius:6px;}

  @media(max-width:860px){
    .sidebar{width:76px;flex:0 0 76px;}
    .nav-item span.lbl{display:none;}
    .nav-section-label{display:none;}
    .sim-box{display:none;}
    .tb-meta{display:none;}
    .nav-badge{position:absolute;top:4px;right:4px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================ ICONS ============================ */
const ICON_ATTRS = 'width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  activity:`<svg ${ICON_ATTRS}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`,
  wrench:`<svg ${ICON_ATTRS}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.4-3.4a6 6 0 0 1-8.1 8.1L6.4 20.6a2.1 2.1 0 0 1-3-3L10.1 11a6 6 0 0 1 8.1-8.1l-3.5 3.4z"/></svg>`,
  zap:`<svg ${ICON_ATTRS}><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
  alertTriangle:`<svg ${ICON_ATTRS}><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13.5"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  barChart:`<svg ${ICON_ATTRS}><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12.5" y="8" width="3" height="10"/><rect x="18" y="5" width="3" height="13"/></svg>`,

/* ============================ HELPERS ============================ */
function fmt(n,d=1){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtInt(n){return Math.round(n).toLocaleString('en-US');}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function nowStr(){
  const d=new Date();
  let h=d.getHours();const m=d.getMinutes();const s=d.getSeconds();
  const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ap}`;
}
function nowShort(){
  const d=new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function combinedHistory(){ return state.historyBase.concat(state.historyLive); }

function chartSVG(id, seriesA, seriesB, colorA, colorB, maxVal, labels){
  const w=1000,h=300,pad=36;
  const n = seriesA.length;
  const xFor = i => pad + (i/(n-1))*(w-pad*2-30);
  const yFor = v => h-pad - clamp(v/maxVal,0,1)*(h-pad*1.4);
  const ptsA = seriesA.map((v,i)=>`${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
  const ptsB = seriesB.map((v,i)=>`${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = h-pad - f*(h-pad*1.4);
    const val = Math.round(maxVal*f);
    return `<line x1="${pad}" y1="${y}" x2="${w-30}" y2="${y}" stroke="#141d29" stroke-width="1"/>
            <text x="${pad-8}" y="${y+4}" fill="#54637a" font-size="11" text-anchor="end" font-family="ui-monospace,monospace">${val}</text>
            <text x="${w-24}" y="${y+4}" fill="#54637a" font-size="11" text-anchor="start" font-family="ui-monospace,monospace">${val}</text>`;
  }).join('');
  const xLabels = labels.map((lb,i)=>{
    const idx = Math.round(i*(n-1)/(labels.length-1));
    return `<text x="${xFor(idx).toFixed(1)}" y="${h-10}" fill="#54637a" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">${lb}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    ${xLabels}
    <polyline id="${id}-a" points="${ptsA}" fill="none" stroke="${colorA}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline id="${id}-b" points="${ptsB}" fill="none" stroke="${colorB}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ============================ PHYSICS / TICK ============================ */
let tickCount = 0;
function tick(){
  const dtReal = 0.2;
  const dtSim = dtReal * state.simSpeed;
  tickCount++;

  const runningEffective = state.running && !state.estop;
  const targetRpm = runningEffective ? state.spRpm : 0;
  const targetHz = runningEffective ? state.spHz : 0;
  const rpmRate = 420; // rpm per sim-second
  const hzRate = 22;
  state.rpm += clamp(targetRpm-state.rpm, -rpmRate*dtSim, rpmRate*dtSim);
  state.hz  += clamp(targetHz-state.hz, -hzRate*dtSim, hzRate*dtSim);
  state.rpm = Math.max(0,state.rpm);
  state.hz = Math.max(0,state.hz);

  const loadRatio = clamp(state.rpm/2000,0,1);
  const targetCurrent = loadRatio*52 * (0.97+0.06*Math.sin(tickCount/9));
  state.current += clamp(targetCurrent-state.current, -30*dtSim, 30*dtSim);
  state.current = Math.max(0,state.current);

  const targetPf = state.rpm>80 ? 0.92 : 0;
  state.pf += clamp(targetPf-state.pf, -0.6*dtSim, 0.6*dtSim);
  state.pf = Math.max(0,state.pf);

  state.voltage = 480.2 + Math.sin(tickCount/14)*0.35;

  state.power = (Math.sqrt(3)*state.voltage*state.current*state.pf)/1000;
  if(state.power>state.peakPower){ state.peakPower = state.power; state.peakTime = nowStr().replace(':'+String(new Date().getSeconds()).padStart(2,'0'),''); }

  const kwhInc = state.power * (dtSim/3600);
  state.totalEnergy += kwhInc;
  state.todayConsumption += kwhInc;

  const targetHeat = runningEffective ? 55+loadRatio*8 : 44;
  state.heatsink += clamp(targetHeat-state.heatsink, -1.2*dtSim, 1.2*dtSim);
  const targetBearing = runningEffective ? 58+loadRatio*6 : 48;
  state.bearingTemp += clamp(targetBearing-state.bearingTemp, -1*dtSim, 1*dtSim);
  state.dcBus = runningEffective ? 678 + Math.sin(tickCount/11)*3 : 671 + Math.sin(tickCount/11)*1.5;

  state.cpuLoad = 17 + Math.sin(tickCount/7)*3 + (runningEffective?4:0);
  state.scanTime = 2.0 + Math.abs(Math.sin(tickCount/13))*0.6;
  state.plcPing = 3 + Math.round(Math.abs(Math.sin(tickCount/17))*3);

  if(tickCount % 5 === 0){
    state.historyLive.push({power:state.power, current:state.current, voltage:state.voltage});
    if(state.historyLive.length>80) state.historyLive.shift();
  }

  patchLiveDOM();
}

/* ============================ DOM PATCHING (no full rerender) ============================ */
function setText(id,val){ const el=document.getElementById(id); if(el) el.textContent = val; }
function setAttr(id,attr,val){ const el=document.getElementById(id); if(el) el.setAttribute(attr,val); }

function patchLiveDOM(){
  setText('tb-clock', nowStr());
  setText('tb-plc-ping', state.plcPing);

  if(state.page==='overview'){
    setText('ov-node-cpu', fmt(state.cpuLoad,1)+'%');
    setText('ov-node-scan', fmt(state.scanTime,1)+' ms');
    setText('ov-vfd-header', fmt(state.hz,0)+' Hz Output');
    setText('ov-node-dcbus', fmtInt(state.dcBus)+' VDC');
    setText('ov-node-heatsink', fmt(state.heatsink,1)+'°C');
    setText('ov-node-rpm', fmtInt(state.rpm)+' RPM');
    setText('ov-node-current', fmt(state.current,0)+' A');
    setText('ov-node-bearing', fmt(state.bearingTemp,1)+'°C');
    setText('ov-meter-header', fmt(state.power,0)+' kW Active');
    setText('ov-node-voltage', fmt(state.voltage,1)+' V');
    setText('ov-node-pf', fmt(state.pf,2));
    setText('ov-node-kwh', fmt(state.totalEnergy,1));
    const rpmEl=document.getElementById('ov-card-rpm'); if(rpmEl) rpmEl.innerHTML = fmtInt(state.rpm)+'<span class="unit">RPM</span>';
    const hzEl=document.getElementById('ov-card-hz'); if(hzEl) hzEl.innerHTML = fmt(state.hz,0)+'<span class="unit">Hz</span>';
    const curEl=document.getElementById('ov-card-current'); if(curEl) curEl.innerHTML = fmt(state.current,0)+'<span class="unit">A</span>';
    const vEl=document.getElementById('ov-card-voltage'); if(vEl) vEl.innerHTML = fmt(state.voltage,1)+'<span class="unit">V</span>';
    const pEl=document.getElementById('ov-card-power'); if(pEl) pEl.innerHTML = fmt(state.power,0)+'<span class="unit">kW</span>';
    const eEl=document.getElementById('ov-card-energy'); if(eEl) eEl.innerHTML = fmt(state.totalEnergy,1)+'<span class="unit">kWh</span>';
    setText('ov-card-pf', fmt(state.pf,2));
  }

  if(state.page==='motor'){
    setText('mc-actual-rpm', fmtInt(state.rpm));
    setText('mc-actual-hz', fmt(state.hz,0));
  }

  if(state.page==='energy'){
    const hist = combinedHistory();
    setAttr('em-chart-a','points', polyPoints(hist.map(p=>p.power),60));
    setAttr('em-chart-b','points', polyPoints(hist.map(p=>p.current),60));
    setText('em-today', fmt(state.todayConsumption,1)+' kWh');
    setText('em-cost-today', 'Est. Cost: $'+fmt(state.todayConsumption*state.tariff,2));
    setText('em-peak', fmt(state.peakPower,1)+' kW');
  }

  if(state.page==='trends'){
    const hist = combinedHistory();
    setAttr('tr-chart-a','points', polyPoints(hist.map(p=>p.voltage*1.25),600));
    setAttr('tr-chart-b','points', polyPoints(hist.map(p=>p.current*1.25),600));
    setText('tr-pf-value', fmt(state.pf,2)+' PF');
    setAttr('tr-pf-bar','style','width:'+clamp(state.pf*100,0,100)+'%;');
    setText('tr-pf-label', state.pf<=0.01 ? 'No Load — Capacitor Bank Standby' : 'Capacitor Bank Stage '+(state.pf>0.5?'2':'1')+' Engaged');
  }
}

function polyPoints(series,maxVal){
  const w=1000,h=300,pad=36;
  const n=series.length;
  const xFor = i => pad + (i/(n-1))*(w-pad*2-30);
  const yFor = v => h-pad - clamp(v/maxVal,0,1)*(h-pad*1.4);
  return series.map((v,i)=>`${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
}

/* ============================ ACTIONS ============================ */
function addAlarm(sev,source,desc){
  state.alarmSeq++;
  state.alarms.unshift({id:'ALM-'+state.alarmSeq, sev, source, desc, time:nowStr().split(' ')[0], ack:false});
  if(state.alarms.length>30) state.alarms.pop();
}

function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='set-page'){ state.page = el.dataset.page; renderAll(); return; }

  if(action==='toggle-run'){
    if(state.estop) return;
    state.running = !state.running;
    addAlarm('INFO','HMI-CONSOLE', state.running ? 'Motor start command executed by operator' : 'Motor stop command executed by operator');
    renderAll(); return;
  }
  if(action==='start'){
    if(state.estop || state.running) return;
    state.running = true;
    addAlarm('INFO','HMI-CONSOLE','Motor start command executed by operator');
    renderAll(); return;
  }
  if(action==='stop'){
    if(!state.running) return;
    state.running = false;
    addAlarm('INFO','HMI-CONSOLE','Motor stop command executed by operator');
    renderAll(); return;
  }
  if(action==='estop'){
    state.estop = !state.estop;
    if(state.estop){
      state.running = false;
      addAlarm('CRITICAL','HMI-CONSOLE','Emergency stop activated by operator');
    } else {
      addAlarm('INFO','HMI-CONSOLE','Emergency stop reset by operator');
    }
    renderAll(); return;
  }
  if(action==='set-mode'){ state.mode = el.dataset.mode; renderAll(); return; }
  if(action==='preset-rpm'){ state.spRpm = Number(el.dataset.value); renderAll(); return; }
  if(action==='preset-hz'){ state.spHz = Number(el.dataset.value); renderAll(); return; }
  if(action==='set-sim-speed'){ state.simSpeed = Number(el.dataset.value); renderAll(); return; }
  if(action==='set-range'){ state.timeRange = el.dataset.value; renderAll(); return; }
  if(action==='ack'){
    const a = state.alarms.find(x=>x.id===el.dataset.id);
    if(a) a.ack = true;
    renderAll(); return;
  }
}

function handleInput(e){
  const t = e.target;
  if(t.matches('input[type=range]')){
    const bind = t.dataset.bind;
    state[bind] = Number(t.value);
    if(bind==='spRpm'){
      const row = t.closest('.sp-block');
      const valEl = row.querySelector('.sp-head .val');
      if(valEl) valEl.textContent = fmtInt(state.spRpm)+' RPM';
      const cardHz = document.getElementById('ov-card-rpm'); // no-op guard
    }
    if(bind==='spHz'){
      const row = t.closest('.sp-block');
      const valEl = row.querySelector('.sp-head .val');
      if(valEl) valEl.textContent = fmt(state.spHz,0)+' Hz';
    }
  }
  if(t.matches('input[data-setting]')){
    const key = t.dataset.setting;
    const raw = t.value.replace(/[^\d.]/g,'');
    if(raw!=='' && !isNaN(Number(raw))) state.settings[key] = Number(raw);
  }
}

document.body.addEventListener('click', handleClick);
document.body.addEventListener('input', handleInput);

/* ============================ INIT ============================ */
renderAll();
setInterval(tick, 200);
</script>
